<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex 4G - حماية الرصيد</title>
    <style>
        :root { --red: #e60000; --dark: #0f172a; }
        body { background: var(--dark); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 360px; text-align: center; border-top: 8px solid var(--red); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--red); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #status { display: none; }
        .progress { background: #eee; border-radius: 10px; height: 15px; margin: 15px 0; overflow: hidden; }
        .fill { background: var(--red); height: 100%; width: 0%; transition: 0.3s; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:var(--red)">VORTEX 4G</h2>
        <div id="login">
            <input type="text" id="user" placeholder="اسم المستخدم">
            <select id="speed">
                <option value="0.05">سرعة اقتصادية (توفير)</option>
                <option value="0.20">سرعة فائقة (يوتيوب/ألعاب)</option>
            </select>
            <button onclick="activate()">تفعيل الباقة</button>
        </div>
        <div id="status">
            <p>المستخدم: <b id="name"></b></p>
            <div style="display:flex; justify-content:space-between; font-size:14px;">
                <span>المتبقي: <span id="rem">400.00</span> MB</span>
                <span>المستهلك: <span id="usd">0.00</span> MB</span>
            </div>
            <div class="progress"><div id="bar" class="fill"></div></div>
            <p style="font-size:11px; color:#666">يتم حفظ الاستهلاك تلقائياً في ذاكرة هاتفك</p>
        </div>
    </div>

    <script>
        // استرجاع البيانات المخزنة من المتصفح لضمان عدم التصفير
        let usedData = parseFloat(localStorage.getItem('vortex_used')) || 0;
        let activeUser = localStorage.getItem('vortex_user');
        let selectedSpeed = parseFloat(localStorage.getItem('vortex_speed')) || 0.05;

        function updateUI() {
            if (usedData >= 400) {
                alert("انتهت باقة الـ 400MB");
                localStorage.clear();
                location.reload();
                return;
            }
            document.getElementById('usd').innerText = usedData.toFixed(2);
            document.getElementById('rem').innerText = (400 - usedData).toFixed(2);
            document.getElementById('bar').style.width = (usedData / 400 * 100) + "%";
            // حفظ الاستهلاك الحالي في المتصفح فوراً
            localStorage.setItem('vortex_used', usedData);
        }

        function activate() {
            let u = document.getElementById('user').value;
            let s = document.getElementById('speed').value;
            if(!u) return alert("يرجى إدخال الاسم");
            localStorage.setItem('vortex_user', u);
            localStorage.setItem('vortex_speed', s);
            location.reload();
        }

        if(activeUser) {
            document.getElementById('login').style.display = 'none';
            document.getElementById('status').style.display = 'block';
            document.getElementById('name').innerText = activeUser;
            
            setInterval(() => {
                usedData += selectedSpeed; // استخدام السرعة المختارة لزيادة دقة العداد
                updateUI();
            }, 1000);
        }
    </script>
</body>
</html>
